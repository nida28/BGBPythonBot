<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BGB Bot</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%234C8DFF'/%3E%3Cstop offset='100%25' stop-color='%237fb0ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='34' font-family='Newsreader,serif' fill='white'%3E%C2%A7%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0B0E13;
      --surface: #141a24;
      --surface-2: #1a2230;
      --elev: #1e2736;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.16);
      --text: #EAEDF2;
      --dim: #b9c1ce;
      --faint: #8b94a4;
      --accent: #4C8DFF;
      --accent-2: #7fb0ff;
      --accent-soft: rgba(76,141,255,0.13);
      --user-bubble: rgba(76,141,255,0.12);
      --shadow: 0 8px 30px rgba(0,0,0,.18);
    }
    html[data-theme="light"] {
      --bg: #F7F9FC;
      --surface: #FFFFFF;
      --surface-2: #F1F4F9;
      --elev: #FFFFFF;
      --border: rgba(12,22,40,0.09);
      --border-strong: rgba(12,22,40,0.18);
      --text: #141A23;
      --dim: #44505f;
      --faint: #6a7484;
      --accent: #2F6DF0;
      --accent-2: #2456cc;
      --accent-soft: rgba(47,109,240,0.09);
      --user-bubble: rgba(47,109,240,0.10);
      --shadow: 0 8px 26px rgba(20,40,80,.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Figtree", sans-serif;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      overflow: hidden;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .top {
      height: 64px;
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
    .glyph {
      width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
      background: linear-gradient(150deg, var(--accent), var(--accent-2));
      color: #fff; font-family: "Newsreader", serif; font-size: 18px;
      font-variant-ligatures: none;
      line-height: 1;
    }
    .brand small { color: var(--dim); font-size: 12.5px; margin-left: 7px; font-weight: 500; letter-spacing: 0; }
    .spacer { flex: 1; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--dim); display: grid; place-items: center; cursor: pointer;
    }
    .bgb-toggle {
      display: inline-flex; align-items: center; gap: 13px; padding: 9px 12px 9px 16px;
      border-radius: 13px; border: 1.5px solid var(--border-strong); background: var(--surface);
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .bgb-toggle .lbl { display: inline-flex; align-items: center; gap: 7px; color: var(--text); }
    .bgb-toggle .lbl svg { color: var(--faint); }
    .bgb-toggle .state {
      font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700;
      padding: 3px 7px; border-radius: 6px; color: var(--faint); background: var(--surface-2);
    }
    .switch { width: 42px; height: 24px; border-radius: 999px; background: var(--surface-2); position: relative; }
    .switch i { position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: transform .18s ease; }
    .bgb-toggle.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); }
    .bgb-toggle.on .lbl, .bgb-toggle.on .lbl svg { color: var(--accent); }
    .bgb-toggle.on .state { color: var(--accent); background: rgba(76,141,255,.18); }
    .bgb-toggle.on .switch { background: var(--accent); }
    .bgb-toggle.on .switch i { transform: translateX(18px); }

    .body { flex: 1; overflow: auto; padding: 0 24px; }
    .col { max-width: 720px; margin: 0 auto; }
    .welcome { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .hello-glyph {
      width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(150deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; color: #fff; font-family: "Newsreader", serif; font-size: 30px;
      font-variant-ligatures: none;
      line-height: 1;
      box-shadow: 0 10px 30px var(--accent-soft); margin-bottom: 22px;
    }
    h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.025em; text-align: center; }
    .greet-sub { margin: 13px 0 0; max-width: 440px; font-size: 15.5px; color: var(--dim); line-height: 1.55; text-align: center; }
    .sugs { margin-top: 20px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sug {
      border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 14px;
      text-align: left; padding: 15px 16px; cursor: pointer; transition: transform .14s ease, border-color .14s ease;
    }
    .sug:hover { border-color: var(--accent); transform: translateY(-1px); }
    .sug .st { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
    .tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 5px; }
    .sug .sq { margin-top: 5px; display: block; font-size: 12.5px; color: var(--dim); line-height: 1.45; }

    .convo { padding: 30px 0 14px; display: flex; flex-direction: column; gap: 26px; }
    .msg-user {
      align-self: flex-end; max-width: 78%; border-radius: 16px 16px 5px 16px; border: 1px solid var(--border);
      background: var(--user-bubble); padding: 13px 17px; font-size: 14.5px; line-height: 1.5;
    }
    .msg-ai { display: flex; align-items: flex-start; gap: 14px; }
    .ai-ava {
      width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
      background: linear-gradient(150deg, var(--accent), var(--accent-2));
      color: #fff; font-family: "Newsreader", serif; font-size: 17px; flex-shrink: 0;
      font-variant-ligatures: none;
      line-height: 1;
    }
    .ai-body { font-size: 14.5px; line-height: 1.62; min-width: 0; }
    .ai-body p { margin: 0 0 14px; color: var(--dim); }
    .ai-body a { color: var(--accent); }
    .ai-body .cite-pill {
      display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600;
      color: var(--accent); text-decoration: none; background: var(--accent-soft); border-radius: 6px;
      padding: 1px 8px; margin-left: 4px; vertical-align: 1px;
    }
    .ai-body .cite-pill:hover { text-decoration: underline; }
    .error-bubble { border: 1px solid rgba(230, 90, 90, .4); background: rgba(230, 90, 90, .12); color: #f6b7b7; padding: 11px 13px; border-radius: 12px; }
    .typing { color: var(--dim); font-size: 14px; }

    .dock { flex-shrink: 0; padding: 6px 24px 16px; }
    .dock-inner { max-width: 720px; margin: 0 auto; }
    .composer {
      border: 1px solid var(--border-strong); background: var(--surface); border-radius: 18px; padding: 8px;
      box-shadow: var(--shadow);
    }
    .attach-chip {
      display: inline-flex; align-items: center; gap: 8px; border-radius: 9px; padding: 6px 10px;
      background: var(--accent-soft); border: 1px solid var(--border); margin: 2px 0 7px 2px;
    }
    .attach-chip .nm { color: var(--accent); font-weight: 600; }
    .attach-chip .meta { color: var(--faint); }
    .rm {
      border: 0; background: transparent; color: var(--faint); display: grid; place-items: center;
      cursor: pointer; padding: 0;
    }
    .composer-row { display: flex; align-items: flex-end; gap: 8px; }
    .composer-row textarea {
      flex: 1; min-height: 38px; max-height: 140px; resize: none; border: 0; outline: 0; background: transparent;
      color: var(--text); font: 400 15px/1.45 "Figtree", sans-serif; padding: 8px 6px;
    }
    .composer-row textarea::placeholder { color: var(--faint); }
    .send {
      width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--accent); color: #fff;
      display: grid; place-items: center; cursor: pointer;
    }
    .send:disabled { opacity: .5; cursor: not-allowed; }
    .disclaimer {
      max-width: 720px; margin: 10px auto 0; display: flex; align-items: flex-start; gap: 11px;
      border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); padding: 10px 15px;
      font-size: 12.5px; line-height: 1.45; color: var(--dim);
          box-shadow: 0 0 0 1px var(--accent-soft), 0 6px 18px rgba(0,0,0,.12);
    }
    .disclaimer .lead { color: var(--text); font-weight: 700; }

    @media (max-width: 760px) {
      .top { padding: 0 16px; }
      .body, .dock { padding-left: 16px; padding-right: 16px; }
      .sugs { grid-template-columns: 1fr; }
      .brand small { display: none; }
      .bgb-toggle .lbl span { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><span class="glyph">&sect;</span><span>BGB Bot<small>German Civil Code guide</small></span></div>
      <div class="spacer"></div>
      <button id="bgbToggle" class="bgb-toggle" type="button" aria-pressed="false">
        <span class="lbl"><span data-icon="book"></span><span>BGB search</span></span>
        <span id="bgbState" class="state">Off</span>
        <span class="switch" aria-hidden="true"><i></i></span>
      </button>
      <button id="themeBtn" class="icon-btn" type="button" title="Toggle theme"></button>
    </header>

    <main id="body" class="body"><div id="content" class="col welcome"></div></main>

    <footer class="dock">
      <div class="dock-inner">
        <div class="composer">
          <div id="attachChip"></div>
          <div class="composer-row">
            <input id="fileInput" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
            <button id="attachBtn" class="icon-btn" type="button" title="Attach PDF or DOCX"></button>
            <textarea id="messageInput" placeholder="Ask about German civil law..." rows="1"></textarea>
            <button id="sendBtn" class="send" type="button" title="Send"></button>
          </div>
        </div>
      </div>
      <div class="disclaimer"><span data-icon="scale"></span><span><span class="lead">General guidance only - not legal advice.</span> BGB Bot can be wrong. For decisions about your situation, consult a licensed German lawyer (Rechtsanwalt).</span></div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const SUGGESTIONS = [
      { title: "Rent increase check", q: "Cite the BGB sections I should verify before agreeing to a landlord rent increase, and explain the timing rules.", bgb: true },
      { title: "Defective product return", q: "Under the BGB, what remedies apply if a newly purchased laptop is defective, and which sections govern repair vs refund?", bgb: true },
      { title: "Consumer withdrawal", q: "For an online purchase in Germany, explain my withdrawal right under the BGB and cite the relevant sections and deadlines.", bgb: true },
      { title: "Tenancy notice period", q: "According to the BGB, what notice period applies if a tenant wants to terminate a residential lease?", bgb: true },
    ];

    const icons = {
      attach: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-8.49 8.49a5 5 0 01-7.07-7.07l8.49-8.49a3 3 0 014.24 4.24l-8.49 8.49a1 1 0 01-1.41-1.41l7.78-7.78"/></svg>',
      send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>',
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
      moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>',
      scale: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10"/><path d="M5 7h14l-3.5 1.2M5 7l3.5 1.2M5 7l-2.5 6a3 3 0 005 0L5 7zM19 7l-2.5 6a3 3 0 005 0L19 7z"/></svg>',
      book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>',
      file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',
      x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>'
    };

    const state = {
      theme: 'dark',
      bgbSearch: false,
      attachedFile: null,
      messages: [],
      isSending: false,
    };

    const el = {
      root: document.documentElement,
      content: document.getElementById('content'),
      body: document.getElementById('body'),
      bgbToggle: document.getElementById('bgbToggle'),
      bgbState: document.getElementById('bgbState'),
      themeBtn: document.getElementById('themeBtn'),
      attachBtn: document.getElementById('attachBtn'),
      fileInput: document.getElementById('fileInput'),
      attachChip: document.getElementById('attachChip'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
    };

    function setIcon(target, name, size = 18) {
      target.innerHTML = icons[name] || '';
      const svg = target.querySelector('svg');
      if (svg) {
        svg.style.width = `${size}px`;
        svg.style.height = `${size}px`;
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function autoResizeTextarea() {
      el.messageInput.style.height = 'auto';
      el.messageInput.style.height = `${Math.min(el.messageInput.scrollHeight, 140)}px`;
    }

    function applyTheme(theme) {
      state.theme = theme;
      el.root.setAttribute('data-theme', theme);
      localStorage.setItem('lex_theme', theme);
      setIcon(el.themeBtn, theme === 'dark' ? 'sun' : 'moon', 17);
    }

    function renderAttachChip() {
      if (!state.attachedFile) {
        el.attachChip.innerHTML = '';
        return;
      }
      el.attachChip.innerHTML = `
        <div class="attach-chip">
          <span data-chip-icon></span>
          <span class="nm">${escapeHtml(state.attachedFile.filename)}</span>
          <span class="meta">- indexed</span>
          <button class="rm" type="button" title="Remove file"><span data-chip-close></span></button>
        </div>`;
      setIcon(el.attachChip.querySelector('[data-chip-icon]'), 'file', 14);
      setIcon(el.attachChip.querySelector('[data-chip-close]'), 'x', 13);
      el.attachChip.querySelector('.rm').addEventListener('click', () => {
        state.attachedFile = null;
        el.fileInput.value = '';
        renderAttachChip();
      });
    }

    function renderWelcome() {
      const cards = SUGGESTIONS.map((s, idx) => `
        <button class="sug" type="button" data-sug="${idx}">
          <span class="st">${escapeHtml(s.title)} ${s.bgb ? '<span class="tag">BGB</span>' : ''}</span>
          <span class="sq">${escapeHtml(s.q)}</span>
        </button>`).join('');
      el.content.className = 'col welcome';
      el.content.innerHTML = `
        <div class="hello-glyph">&sect;</div>
        <h1>What does the BGB say about it?</h1>
        <p class="greet-sub">Ask about tenancy, contracts, consumer rights and more. Turn on <b style="color:var(--text)">BGB search</b> to ground answers in the actual code, or attach your own document for context.</p>
        <div class="sugs">${cards}</div>`;
      [...el.content.querySelectorAll('[data-sug]')].forEach((btn) => {
        btn.addEventListener('click', () => {
          const item = SUGGESTIONS[Number(btn.dataset.sug)];
          el.messageInput.value = item.q;
          if (item.bgb) state.bgbSearch = true;
          syncHeaderState();
          autoResizeTextarea();
          el.messageInput.focus();
        });
      });
    }

    function styleCitations(container) {
      container.querySelectorAll('a').forEach((a) => {
        if (/section\s+\d+/i.test(a.textContent || '')) {
          const num = (a.textContent.match(/section\s+([0-9]+[a-z]?)/i) || [])[1];
          if (num) a.textContent = `\u00A7${num}`;
          a.classList.add('cite-pill');
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
      });
    }

    function renderConversation() {
      el.content.className = 'col convo';
      el.content.innerHTML = '';
      for (const msg of state.messages) {
        if (msg.role === 'user') {
          const div = document.createElement('div');
          div.className = 'msg-user';
          div.textContent = msg.content;
          el.content.appendChild(div);
          continue;
        }
        const wrap = document.createElement('div');
        wrap.className = 'msg-ai';
        const ava = document.createElement('div');
        ava.className = 'ai-ava';
        ava.innerHTML = '&sect;';
        const body = document.createElement('div');
        body.className = 'ai-body';

        if (msg.status === 'loading') {
          body.innerHTML = '<div class="typing">BGB Bot is thinking...</div>';
        } else if (msg.status === 'error') {
          body.innerHTML = `<div class="error-bubble">${escapeHtml(msg.content)}</div>`;
        } else {
          body.innerHTML = marked.parse(msg.content || '');
          styleCitations(body);
        }

        wrap.appendChild(ava);
        wrap.appendChild(body);
        el.content.appendChild(wrap);
      }
      el.body.scrollTop = el.body.scrollHeight;
    }

    function syncHeaderState() {
      el.bgbToggle.classList.toggle('on', state.bgbSearch);
      el.bgbToggle.setAttribute('aria-pressed', String(state.bgbSearch));
      el.bgbState.textContent = state.bgbSearch ? 'On' : 'Off';
    }

    async function uploadFile(file) {
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch('/upload', { method: 'POST', body: fd });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || 'Upload failed');
      }
      const data = await res.json();
      state.attachedFile = { filename: data.filename || file.name };
      renderAttachChip();
    }

    async function sendMessage() {
      if (state.isSending) return;
      const message = el.messageInput.value.trim();
      if (!message) return;

      state.isSending = true;
      el.sendBtn.disabled = true;

      if (state.messages.length === 0) {
        el.content.className = 'col convo';
      }

      state.messages.push({ role: 'user', content: message });
      state.messages.push({ role: 'assistant', content: '', status: 'loading' });
      renderConversation();

      el.messageInput.value = '';
      autoResizeTextarea();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, bgb_search: state.bgbSearch }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || 'Chat request failed');
        }
        const data = await res.json();
        state.messages[state.messages.length - 1] = { role: 'assistant', content: data.answer || '' };
      } catch (err) {
        state.messages[state.messages.length - 1] = {
          role: 'assistant',
          status: 'error',
          content: `Request failed: ${err.message}`,
        };
      } finally {
        state.isSending = false;
        el.sendBtn.disabled = false;
        renderConversation();
      }
    }

    function renderMain() {
      syncHeaderState();
      renderAttachChip();
      if (state.messages.length === 0) renderWelcome();
      else renderConversation();
    }

    function init() {
      const savedTheme = localStorage.getItem('lex_theme');
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      applyTheme(savedTheme || (prefersLight ? 'light' : 'dark'));

      document.querySelectorAll('[data-icon]').forEach((node) => setIcon(node, node.dataset.icon, 17));
      setIcon(el.attachBtn, 'attach', 19);
      setIcon(el.sendBtn, 'send', 18);

      el.bgbToggle.addEventListener('click', () => {
        state.bgbSearch = !state.bgbSearch;
        syncHeaderState();
      });

      el.themeBtn.addEventListener('click', () => {
        applyTheme(state.theme === 'dark' ? 'light' : 'dark');
      });

      el.attachBtn.addEventListener('click', () => el.fileInput.click());
      el.fileInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          await uploadFile(file);
        } catch (err) {
          state.messages.push({ role: 'assistant', status: 'error', content: `Upload failed: ${err.message}` });
          renderConversation();
        }
      });

      el.sendBtn.addEventListener('click', sendMessage);
      el.messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      el.messageInput.addEventListener('input', autoResizeTextarea);
      autoResizeTextarea();
      renderMain();
    }

    init();
  </script>
</body>
</html>
